<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e14;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f1419;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050508;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0e6d2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c8aa6e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#785a28;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#c8aa6e;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0.3" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Subtle color wash -->
  <rect width="1200" height="630" fill="url(#redGlow)" opacity="0.4"/>
  
  <!-- Grid Pattern -->
  <g opacity="0.04">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="1"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>
  
  <!-- Corner Decorations -->
  <path d="M 40 70 L 40 40 L 70 40" stroke="#c8aa6e" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M 1160 70 L 1160 40 L 1130 40" stroke="#c8aa6e" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M 40 560 L 40 590 L 70 590" stroke="#c8aa6e" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M 1160 560 L 1160 590 L 1130 590" stroke="#c8aa6e" stroke-width="3" fill="none" opacity="0.5"/>
  
  <!-- Decorative horizontal lines -->
  <line x1="80" y1="130" x2="280" y2="130" stroke="#c8aa6e" stroke-width="1" opacity="0.2"/>
  <line x1="920" y1="130" x2="1120" y2="130" stroke="#c8aa6e" stroke-width="1" opacity="0.2"/>
  
  <!-- Early Access Badge -->
  <rect x="460" y="100" width="280" height="32" rx="4" fill="none" stroke="#c8aa6e" stroke-width="1.5" opacity="0.6"/>
  <text x="600" y="122" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#c8aa6e" text-anchor="middle" letter-spacing="4" opacity="0.8">EARLY ACCESS TOOLS</text>
  
  <!-- Main Title -->
  <text x="600" y="210" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="url(#goldGradient)" text-anchor="middle" filter="url(#glow)">Slay the Spire 2</text>
  
  <!-- Subtitle -->
  <text x="600" y="265" font-family="Arial, sans-serif" font-size="24" fill="#a09b8c" text-anchor="middle">Deck Builder · Tier Lists · Synergy Explorer · Guides</text>
  
  <!-- Divider -->
  <line x1="350" y1="300" x2="850" y2="300" stroke="#c8aa6e" stroke-width="1" opacity="0.3"/>
  <circle cx="600" cy="300" r="4" fill="#c8aa6e" opacity="0.5"/>
  
  <!-- Feature Cards Row -->
  <!-- Card 1: Deck Builder -->
  <rect x="115" y="335" width="210" height="100" rx="6" fill="#0a0e14" stroke="#c8aa6e" stroke-width="1" opacity="0.8"/>
  <text x="220" y="370" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#c8aa6e" text-anchor="middle">Deck Builder</text>
  <text x="220" y="395" font-family="Arial, sans-serif" font-size="12" fill="#888" text-anchor="middle">Build &amp; share decks</text>
  <text x="220" y="415" font-family="Arial, sans-serif" font-size="12" fill="#888" text-anchor="middle">AI-powered reviews</text>
  
  <!-- Card 2: Tier Lists -->
  <rect x="355" y="335" width="210" height="100" rx="6" fill="#0a0e14" stroke="#c8aa6e" stroke-width="1" opacity="0.8"/>
  <text x="460" y="370" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#c8aa6e" text-anchor="middle">Tier Lists</text>
  <text x="460" y="395" font-family="Arial, sans-serif" font-size="12" fill="#888" text-anchor="middle">Cards, Potions &amp; Relics</text>
  <text x="460" y="415" font-family="Arial, sans-serif" font-size="12" fill="#888" text-anchor="middle">Community voting</text>
  
  <!-- Card 3: Guides -->
  <rect x="595" y="335" width="210" height="100" rx="6" fill="#0a0e14" stroke="#c8aa6e" stroke-width="1" opacity="0.8"/>
  <text x="700" y="370" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#c8aa6e" text-anchor="middle">Character Guides</text>
  <text x="700" y="395" font-family="Arial, sans-serif" font-size="12" fill="#888" text-anchor="middle">All 5 characters</text>
  <text x="700" y="415" font-family="Arial, sans-serif" font-size="12" fill="#888" text-anchor="middle">Strategies &amp; archetypes</text>
  
  <!-- Card 4: Synergies -->
  <rect x="835" y="335" width="210" height="100" rx="6" fill="#0a0e14" stroke="#c8aa6e" stroke-width="1" opacity="0.8"/>
  <text x="940" y="370" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#c8aa6e" text-anchor="middle">Synergy Explorer</text>
  <text x="940" y="395" font-family="Arial, sans-serif" font-size="12" fill="#888" text-anchor="middle">Keyword combos</text>
  <text x="940" y="415" font-family="Arial, sans-serif" font-size="12" fill="#888" text-anchor="middle">Trigger chains</text>
  
  <!-- Character names -->
  <text x="600" y="485" font-family="Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle" letter-spacing="2">IRONCLAD · SILENT · DEFECT · NECROBINDER · REGENT</text>
  
  <!-- Bottom branding -->
  <text x="600" y="555" font-family="Georgia, serif" font-size="42" font-weight="700" fill="url(#goldGradient)" text-anchor="middle" filter="url(#glow)">ggez.gg</text>
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="14" fill="#666" text-anchor="middle">Free tools for every Spire climber</text>
</svg>
